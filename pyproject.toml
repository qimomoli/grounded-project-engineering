[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-project-engineering"
dynamic = ["version"]
description = "Evidence-first, grounded, and testable project engineering skills for AI-assisted development."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
gpe = "gpe.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gpe.__version__" }

[tool.setuptools.packages.find]
include = ["gpe*"]
